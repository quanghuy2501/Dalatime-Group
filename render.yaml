services:
  - type: web
    name: Dalatime-Group
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: node src/server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: MASTER_SPREADSHEET_ID
        value: 1NS7w8J44x09eD1n5WmaCF6UlZDm8sLYThMf_Nhha4p0
      - key: EMPLOYEE_FOLDER_ID
        value: 1sIMJ0TTPEC_hu6OBuW8hSHRLbb0Ajcr8
      - key: INACTIVE_STAFF_IDS
        value: NV15,NV16
      - key: REPORT_PORTAL_CONFIG_FILE
        sync: false
      - key: REPORT_PORTAL_LINKS_FILE
        sync: false
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: DASHBOARD_BASIC_USER
        sync: false
      - key: DASHBOARD_BASIC_PASS
        sync: false

  # Scheduled, pay-per-run automation. No always-on worker or persistent disk.
  - type: cron
    name: Dalatime-Group-direct-nv-ingestion
    runtime: node
    region: singapore
    schedule: "*/30 * * * *"
    buildCommand: npm ci
    startCommand: npm run sync:nv
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: MASTER_SPREADSHEET_ID
        value: 1NS7w8J44x09eD1n5WmaCF6UlZDm8sLYThMf_Nhha4p0
      - key: INACTIVE_STAFF_IDS
        value: NV15,NV16
      - key: NV_CONCURRENCY
        value: "3"
      - key: NV_PAGE_ROWS
        value: "500"

  - type: cron
    name: Dalatime-Group-report-batch
    runtime: python
    region: singapore
    schedule: "0 6 * * *"
    buildCommand: python3 -m compileall -q automation scripts/master_snapshot.py
    startCommand: python3 -m automation.report_batch.runner_cli scheduled-run --production
    envVars:
      - key: ONICORN_ENV
        value: production
      - key: SNAPSHOT_DIR
        value: /tmp/onicorn-report-state
      - key: ONICORN_LOCK_FILE
        value: /tmp/onicorn-report-state/run.lock
      - key: DATABASE_URL
        sync: false
      - key: DB_VERIFY_SELECT
        value: SELECT 1
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: MASTER_SPREADSHEET_ID
        value: 1NS7w8J44x09eD1n5WmaCF6UlZDm8sLYThMf_Nhha4p0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SNAPSHOT_BUCKET
        value: onicorn-snapshots
      - key: FAILURE_NOTIFY_URL
        sync: false
